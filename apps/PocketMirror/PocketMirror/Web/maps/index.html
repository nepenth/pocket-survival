<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Maps</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="maps.css">
</head>
<body class="map-page">
  <div id="map"></div>

  <a class="map-btn home" href="/" aria-label="Home">⌂</a>
  <button class="map-btn locate" id="locate" aria-label="Show my position">◎</button>
  <button class="map-btn search" id="searchBtn" aria-label="Search places">⌕</button>
  <button class="map-btn topo" id="topoBtn" aria-label="Topographic layer" hidden>⛰</button>

  <div class="search-panel" id="searchPanel" hidden>
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="Towns, peaks, lakes, hospitals…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="searchClose" aria-label="Close search">Cancel</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="guide" id="guide" hidden>
    <div id="guideText"></div>
    <div class="guide-btns">
      <button id="guideSteps" type="button">Steps</button>
      <button id="guideStop" type="button" class="quiet">Stop</button>
    </div>
  </div>

  <div class="steps-panel" id="stepsPanel" hidden>
    <div class="search-row"><b>Directions</b><button id="stepsClose" type="button">Close</button></div>
    <div id="stepsList" class="search-results"></div>
  </div>

  <div class="panel" id="panel">
    <div id="status">Tap ◎ to show your position. GPS works without internet.</div>
    <div id="coords" class="coords"></div>
  </div>

  <div class="notice" id="notice" hidden>
    <h2>No maps on this phone yet</h2>
    <p>Copy the <b>maps</b> folder into Pocket Mirror: connect the phone to a Mac, open it in Finder,
      choose <b>Files › Pocket Mirror</b> and drag the folder in. Then reopen this page.</p>
    <p><a href="/">← Home</a></p>
  </div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
<script src="/vendor/pmtiles/pmtiles.js"></script>
<script src="maps.js"></script>
</body>
</html>
