name: Topo overlay (New England)

# Builds contour + hillshade map layers from USGS 3DEP elevation data. Run on demand; the result is a
# workflow artifact that tools/fetch-topo.sh downloads onto the external SSD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build-topo.sh"
      - ".github/workflows/topo.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Privacy check (public repo)
        run: ci/privacy-check.sh

      - name: Install GDAL, tippecanoe and pmtiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal tippecanoe
          curl -sfL -o /tmp/pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/pmtiles.tar.gz -C /usr/local/bin pmtiles
          gdalinfo --version; tippecanoe --version 2>&1 | head -1; pmtiles version | head -1
          df -h .

      - name: Use the runner's large /mnt disk
        run: sudo mkdir -p /mnt/topo-work && sudo chown "$USER" /mnt/topo-work /mnt

      - name: Build topo layers
        run: OUT=out WORK=/mnt/topo-work tools/build-topo.sh
        env:
          TMPDIR: /mnt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: topo-new-england
          path: out/
          retention-days: 30
          compression-level: 0
